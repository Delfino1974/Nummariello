<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Nummariello</title>
<style>
  :root {
    --blu: #00A2E8;
    --verde: #00C853;
    --marrone: #A52A2A;
    --grigio-cella: #EEEEEE;
    --grigio-cella-scuro: #424242;
    --grigio-barra: #CFD8DC;
    --grigio-pannello: #F5F5F5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    text-align: center;
    min-height: 100%;
  }
  h1.app-name {
    color: var(--marrone);
    font-size: 44px;
    font-weight: 700;
    margin: 8px 0 0 0;
  }
  h2.title-coffee {
    font-size: 24px;
    font-weight: 700;
    margin: 8px 0 0 0;
    color: #111;
  }
  p.subtitle {
    font-size: 15px;
    margin: 4px 0 0 0;
    color: #333;
  }
  #editMax {
    width: 180px;
    margin-top: 20px;
    text-align: center;
    font-size: 16px;
    padding: 8px 4px;
    border: none;
    border-bottom: 2px solid #999;
    background: transparent;
    outline: none;
  }
  #editMax:focus { border-bottom-color: var(--blu); }
  p.max-choice {
    font-size: 14px;
    margin: 4px 0 0 0;
    color: #555;
  }
  #textNumero {
    color: var(--verde);
    font-weight: 700;
    font-size: min(38vw, 220px);
    line-height: 1;
    margin: 16px 0;
    user-select: none;
    transition: transform 0.12s ease;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button.action {
    background: var(--blu);
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    min-width: 130px;
  }
  button.action:active { filter: brightness(0.9); }

  /* Pannello Tabella */
  #containerTabella {
    position: fixed;
    left: 0;
    right: 0;
    top: 95px;
    margin: 0 auto;
    width: 100%;
    max-width: 480px;
    min-height: 500px;
    max-height: 75vh;
    background: var(--grigio-pannello);
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
    z-index: 50;
    touch-action: none;
  }
  #containerTabella.visibile { display: flex; }
  #handleTabella {
    display: flex;
    align-items: center;
    background: var(--grigio-barra);
    padding: 10px 8px;
    cursor: grab;
    touch-action: none;
  }
  #handleTabella .titolo {
    flex: 1;
    font-weight: 700;
    color: #000;
    text-align: left;
  }
  #buttonChiudiTabella {
    background: var(--blu);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-weight: 700;
    touch-action: manipulation;
    position: relative;
    z-index: 10;
  }
  #gridViewTabellaOverlay {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 8px;
    touch-action: pan-y;
  }
  .cella-numero {
    background: var(--grigio-cella);
    color: #000;
    text-align: center;
    padding: 20px 0;
    font-size: 20px;
    border-radius: 2px;
  }
  .cella-numero.scurita {
    background: var(--grigio-cella-scuro);
    color: #fff;
  }

  /* Splash screen */
  #splashScreen {
    position: fixed;
    inset: 0;
    background: #FFFFFF;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #logoSplash {
    max-width: min(70vw, 400px);
    max-height: min(70vw, 400px);
    opacity: 1;
    transition: opacity 1s ease;
  }
  #containerInfoSplash {
    position: absolute;
    top: 30px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transition: opacity 1s ease;
    padding: 0 20px;
  }
  #containerInfoSplash img {
    max-width: min(60vw, 320px);
  }
  #containerInfoSplash .title-coffee {
    color: #2E7D32;
    font-size: 26px;
    font-weight: 700;
    margin-top: 8px;
  }
  #containerInfoSplash .author-info {
    color: #555555;
    font-size: 17px;
    margin-top: 14px;
  }
  #containerInfoSplash .version-info {
    color: #777777;
    font-size: 13px;
    margin-top: 6px;
  }
  #textTapToContinue {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    color: #999999;
    font-size: 15px;
    opacity: 0;
    transition: opacity 1s ease;
  }
</style>
</head>
<body>

<div id="app">
  <h1 class="app-name">Nummariello</h1>
  <h2 class="title-coffee">Chi paga il caff&egrave;?</h2>
  <p class="subtitle">Scegli un numero o generalo casualmente</p>

  <input id="editMax" type="number" inputmode="numeric" placeholder="Valore massimo" min="1">
  <p class="max-choice">Scegli il numero massimo (30 default)</p>

  <div id="textNumero">?</div>

  <div class="btn-row">
    <button class="action" id="buttonGenera">Genera numero casuale</button>
    <button class="action" id="buttonScegli">Scegli numero</button>
  </div>
  <div class="btn-row">
    <button class="action" id="buttonTabella">Tabella</button>
    <button class="action" id="buttonReset">Reset</button>
  </div>
</div>

<div id="containerTabella">
  <div id="handleTabella">
    <div class="titolo">Numeri chiamati</div>
    <button id="buttonChiudiTabella">X</button>
  </div>
  <div id="gridViewTabellaOverlay"></div>
</div>

<script>
(function() {
  var editMax = document.getElementById('editMax');
  var textNumero = document.getElementById('textNumero');
  var buttonGenera = document.getElementById('buttonGenera');
  var buttonScegli = document.getElementById('buttonScegli');
  var buttonTabella = document.getElementById('buttonTabella');
  var buttonReset = document.getElementById('buttonReset');
  var containerTabella = document.getElementById('containerTabella');
  var handleTabella = document.getElementById('handleTabella');
  var buttonChiudiTabella = document.getElementById('buttonChiudiTabella');
  var grid = document.getElementById('gridViewTabellaOverlay');

  var statiCelle = [];
  var modalitaSceltaAttiva = false;

  function maxCorrente() {
    var v = parseInt(editMax.value, 10);
    return (!isNaN(v) && v >= 1) ? v : 30;
  }

  function animaNumero() {
    textNumero.style.transform = 'scale(1.3)';
    setTimeout(function() {
      textNumero.style.transform = 'scale(1)';
    }, 120);
  }

  function generaTabella(max) {
    if (statiCelle.length !== max) {
      statiCelle = new Array(max).fill(0);
    }
    grid.innerHTML = '';
    for (var i = 0; i < max; i++) {
      var cella = document.createElement('div');
      cella.className = 'cella-numero' + (statiCelle[i] === 1 ? ' scurita' : '');
      cella.textContent = (i + 1).toString();
      cella.dataset.index = i;
      grid.appendChild(cella);
    }
  }

  grid.addEventListener('click', function(e) {
    var cella = e.target.closest('.cella-numero');
    if (!cella) return;
    var index = parseInt(cella.dataset.index, 10);
    if (modalitaSceltaAttiva) {
      var numeroScelto = index + 1;
      textNumero.textContent = numeroScelto.toString();
      animaNumero();
      containerTabella.classList.remove('visibile');
    } else {
      statiCelle[index] = statiCelle[index] === 0 ? 1 : 0;
      cella.classList.toggle('scurita');
    }
  });

  function apriTabella() {
    containerTabella.style.left = '0';
    containerTabella.style.right = '0';
    containerTabella.style.transform = 'none';
    containerTabella.classList.add('visibile');
  }

  buttonGenera.addEventListener('click', function() {
    var max = maxCorrente();
    var numero = Math.floor(Math.random() * max) + 1;
    textNumero.textContent = numero.toString();
    animaNumero();
  });

  buttonScegli.addEventListener('click', function() {
    var max = maxCorrente();
    modalitaSceltaAttiva = true;
    generaTabella(max);
    apriTabella();
  });

  buttonTabella.addEventListener('click', function() {
    var max = maxCorrente();
    modalitaSceltaAttiva = false;
    generaTabella(max);
    apriTabella();
  });

  buttonReset.addEventListener('click', function() {
    textNumero.textContent = '?';
    editMax.value = '';
    statiCelle.fill(0);
    var celle = grid.querySelectorAll('.cella-numero');
    celle.forEach(function(c) { c.classList.remove('scurita'); });
  });

  buttonChiudiTabella.addEventListener('click', function() {
    containerTabella.classList.remove('visibile');
  });

  // Trascinamento pannello Tabella (mouse + touch)
  var dragging = false;
  var startX = 0, startY = 0, startLeft = 0, startTop = 0;

  function posFromEvent(e) {
    if (e.touches && e.touches.length) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function dragStart(e) {
    if (e.target.closest('#buttonChiudiTabella')) return;
    dragging = true;
    var p = posFromEvent(e);
    var rect = containerTabella.getBoundingClientRect();
    startX = p.x;
    startY = p.y;
    startLeft = rect.left;
    startTop = rect.top;
    containerTabella.style.right = 'auto';
    e.preventDefault();
  }

  function dragMove(e) {
    if (!dragging) return;
    var p = posFromEvent(e);
    var newLeft = startLeft + (p.x - startX);
    var newTop = startTop + (p.y - startY);
    containerTabella.style.left = newLeft + 'px';
    containerTabella.style.top = newTop + 'px';
    e.preventDefault();
  }

  function dragEnd() { dragging = false; }

  handleTabella.addEventListener('mousedown', dragStart);
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);
  handleTabella.addEventListener('touchstart', dragStart, { passive: false });
  window.addEventListener('touchmove', dragMove, { passive: false });
  window.addEventListener('touchend', dragEnd);

  // --- Splash screen ---
  var splashScreen = document.getElementById('splashScreen');
  var logoSplash = document.getElementById('logoSplash');
  var containerInfoSplash = document.getElementById('containerInfoSplash');
  var textTapToContinue = document.getElementById('textTapToContinue');

  setTimeout(function() {
    logoSplash.style.opacity = '0';
    setTimeout(function() {
      containerInfoSplash.style.opacity = '1';
      textTapToContinue.style.opacity = '1';
      splashScreen.addEventListener('click', chiudiSplash);
    }, 1000);
  }, 2000);

  function chiudiSplash() {
    splashScreen.style.transition = 'opacity 0.8s ease';
    splashScreen.style.opacity = '0';
    setTimeout(function() {
      splashScreen.style.display = 'none';
    }, 800);
  }
})();
</script>

</body>
</html>
